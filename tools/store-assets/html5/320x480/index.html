<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="ad.size" content="width=320,height=480">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:320px; height:480px; overflow:hidden; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .ad {
    width:320px; height:480px; position:relative; cursor:pointer; overflow:hidden;
    background: radial-gradient(130% 90% at 20% 0%, #37795d 0%, #2f6d54 45%, #133326 100%);
    display:flex; flex-direction:column; align-items:center; color:#fff;
  }
  .glow { position:absolute; width:280px; height:280px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,210,0,0.32), transparent 70%); top:-110px; right:-80px; }
  .badge { position:relative; z-index:1; display:flex; align-items:center; gap:8px; align-self:flex-start;
    margin:26px 0 0 24px; background:rgba(255,255,255,0.16); border-radius:999px; padding:7px 16px 7px 7px;
    font-size:13px; font-weight:700; color:#ffdf4d; }
  .badge i { width:22px; height:22px; border-radius:50%; background:#ffd200; color:#173c2d; font-weight:900; font-size:12px;
    display:flex; align-items:center; justify-content:center; }

  .hero { position:relative; z-index:1; margin-top:30px; text-align:center; padding:0 24px; }
  h1 { font-size:32px; font-weight:800; line-height:1.32; text-shadow:0 2px 10px rgba(0,0,0,0.15); }
  p { margin-top:14px; font-size:15px; color:rgba(255,255,255,0.86); line-height:1.55; }

  .card { position:relative; z-index:1; margin:28px 20px 0; background:#fffdf8; border-radius:22px; padding:26px 22px;
    box-shadow:0 30px 60px rgba(0,0,0,0.28); }
  .voiceBar { display:flex; align-items:center; gap:12px; background:#f6f2ea; border:2.5px solid #295f48;
    border-radius:999px; padding:14px 18px; }
  .voiceBar .mic { width:40px; height:40px; border-radius:50%; background:#295f48; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:20px; }
  .voiceBar .txt { font-size:15px; color:#56645a; font-weight:600; }
  .waves { display:flex; align-items:flex-end; gap:6px; margin-top:20px; justify-content:center; height:44px; }
  .waves i { width:8px; border-radius:4px; background:linear-gradient(180deg,#ffd200,#ffdf4d); display:block; }

  .spacer { flex:1; position:relative; z-index:1; }
  .ctaWrap { position:relative; z-index:1; width:100%; padding:0 24px 30px; }
  .cta { display:block; text-align:center; background:#ffd200; color:#173c2d; font-weight:800; font-size:18px;
    padding:16px; border-radius:999px; box-shadow:0 12px 26px rgba(0,0,0,0.25); }
  .sub-cta { text-align:center; margin-top:10px; font-size:12px; color:rgba(255,255,255,0.72); }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
  .cta { animation:pulse 2.4s ease-in-out infinite; }
</style>
</head>
<body>
  <script>var clickTag = "https://play.google.com/store/apps/details?id=com.jiwongum.app";</script>
  <div class="ad" onclick="window.open(clickTag, '_blank')">
    <div class="glow"></div>
    <div class="badge"><i>₩</i>지원금 살펴줌</div>
    <div class="hero">
      <h1>말 한마디로 찾는<br>정부 지원금</h1>
      <p>기초연금부터 난방비까지, 대신 살펴드려요</p>
    </div>
    <div class="card">
      <div class="voiceBar"><span class="mic">🎤</span><span class="txt">"틀니 지원금 알려줘"</span></div>
      <div class="waves">
        <i style="height:14px"></i><i style="height:30px"></i><i style="height:44px"></i>
        <i style="height:24px"></i><i style="height:38px"></i><i style="height:18px"></i>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="ctaWrap">
      <div class="cta">무료로 확인하기</div>
      <div class="sub-cta">회원가입 없이 · 이용료 없음</div>
    </div>
  </div>
</body>
</html>
